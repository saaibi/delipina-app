services:
  - type: web
    name: delipina-app
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist-server/migrate.js && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 26.13.1
      - key: NODE_ENV
        value: production
      - key: DEV_AUTH
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: playita-db
          property: connectionString
      - key: DATABASE_SCHEMA
        value: delipina
      - key: PG_POOL_MAX
        value: "3"
